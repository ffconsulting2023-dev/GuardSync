name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      # 本番依存の既知脆弱性（critical）を検出。prisma CLI 経由の high（deepmerge-ts）は Prisma 7 移行まで許容
      - run: npm audit --omit=dev --audit-level=critical

      - run: npx tsc --noEmit -p tsconfig.server.json

      - run: npm run build

# GuardSync Nginx 設定（さくらVPS / ホスト側）
# 配置先: /etc/nginx/sites-available/guardsync → sites-enabled/ にシンボリックリンク
#
# 設計:
#  - 静的ファイルは Nginx が直接配信（Express の express.static を経由しない）
#  - /api（Webhook含む）のみ Node(127.0.0.1:3000) へ proxy
#    ※ アプリのWebhookはすべて /api 配下（/api/stripe/webhook, /api/webhook/line-works,
#      /api/inbound/…）。独立した /webhook/ パスは存在しないため location を分けない。

server {
    listen 80;
    server_name guardsync.jp www.guardsync.jp;
    return 301 https://guardsync.jp$request_uri;   # 常に正規（apex）へ
}

server {
    listen 443 ssl;
    http2 on;
    server_name guardsync.jp www.guardsync.jp;

    # www は正規の apex へ寄せる（DNS上 www CNAME @ が設定済み）
    if ($host = www.guardsync.jp) { return 301 https://guardsync.jp$request_uri; }

    # certbot が証明書パスを追記する
    root /opt/guardsync/current/dist/public;
    index index.html;

    client_max_body_size 12m;      # Multerの上限(10MB)に少し余裕を持たせる

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # CSP は Express(helmet) 側で付与するためここでは設定しない。

    # API・Webhook はNodeへ（Stripe署名検証のためボディを改変しない）
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering on;   # Stripe raw body 検証のためバッファリングを維持
        proxy_read_timeout 120s;      # PDF生成など重い処理向け
    }

    # PWA: Service Worker と index.html はキャッシュさせない
    location = /sw.js              { add_header Cache-Control "no-cache, no-store, must-revalidate"; }
    location = /index.html         { add_header Cache-Control "no-cache, no-store, must-revalidate"; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; }

    # ハッシュ付きアセットは長期キャッシュ
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;   # React Router のSPAフォールバック
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}

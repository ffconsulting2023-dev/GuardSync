# GuardSync 本番 docker-compose（さくらVPS）
# 配置先: /opt/guardsync/docker-compose.yml
# ビルドコンテキスト ./current にはCIが dist/ 等を同期する（手順書 §9）。
services:
  app:
    build:
      context: ./current
    env_file: /opt/guardsync/.env
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      # ★ UPLOAD_DIR=/app/uploads/documents に合わせてマウントする。
      #   （アプリの保存先とマウント先を一致させないとアップロードが永続化されない）
      - /var/guardsync/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: always
    # node-cron の多重実行を防ぐため app は必ず1プロセス（レプリカ1）で運用する。
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: guardsync
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: guardsync
      TZ: Asia/Tokyo
    volumes:
      - /var/guardsync/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guardsync"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
